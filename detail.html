<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Details</title>
</head>
<body style="color:#fff; font-family:Arial">
  <p><a style="color:#fff" href="index.html">&larr; Back to main page</a></p>
  <h1 id="name"></h1>
  <table border="1" cellpadding="10">
    <tr>
      <td><a id="link"><img id="pic" width="400"></a></td>
      <td id="text" width="300"></td>
    </tr>
  </table>

  <script>
    const cars = {
      r34: { name: "Nissan Skyline GT-R R34", color: "#1e3a8a", wiki: "Nissan_Skyline_GT-R",
        alt: "Silver Nissan Skyline GT-R R34 coupe",
        text: "Built from 1999 to 2002, the R34 GT-R uses the 2.6 L twin-turbo RB26DETT inline-six and an advanced all-wheel-drive system." },
      mr2: { name: "Toyota MR2", color: "#b45309", wiki: "Toyota_MR2",
        alt: "Toyota MR2 mid-engine two-seat sports car",
        text: "A small mid-engine two-seater sold in three generations between 1984 and 2007, loved for light weight and balanced handling." },
      supra: { name: "Toyota Supra A80", color: "#166534", wiki: "Toyota_Supra_(A80)",
        alt: "Toyota Supra A80 sports coupe with rear wing",
        text: "The fourth-generation Supra (1993-2002), famous for its 3.0 L twin-turbo 2JZ-GTE engine and huge tuning potential." },
      rx7: { name: "Mazda RX-7 FD", color: "#991b1b", wiki: "Mazda_RX-7",
        alt: "Mazda RX-7 rotary-powered sports car",
        text: "The third-generation RX-7 (1992-2002) is known for its sequential twin-turbo 13B-REW rotary engine and sleek, lightweight body." },
      nsx: { name: "Honda NSX", color: "#6b21a8", wiki: "Honda_NSX_(first_generation)",
        alt: "Honda NSX first-generation mid-engine supercar",
        text: "A mid-engine, all-aluminium supercar from 1990 with a V6 and VTEC, designed to be an everyday-usable exotic." }
    };

    const key = new URLSearchParams(location.search).get("car");
    const car = cars[key];

    if (!car) {
      document.getElementById("name").textContent = "Car not found";
    } else {
      document.body.style.background = car.color;
      document.getElementById("name").textContent = car.name;
      document.getElementById("text").textContent = car.text;
      document.getElementById("pic").alt = car.alt;
      document.getElementById("link").href = "https://en.wikipedia.org/wiki/" + car.wiki;
      fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + car.wiki)
        .then(function (r) { return r.json(); })
        .then(function (d) { document.getElementById("pic").src = d.originalimage ? d.originalimage.source : d.thumbnail.source; });
    }
  </script>
</body>
</html>
